<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url("../inter.woff2") format("woff2");font-weight:100 900}
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:Inter,sans-serif;background:#1a1a2e;color:#fff;display:grid;grid-template-columns:1fr 400px;}
.copy{padding:72px 0 72px 80px;display:flex;flex-direction:column}
.mark{display:flex;align-items:center;gap:14px;font-weight:750;font-size:26px}
.mark span{display:grid;place-items:center;width:56px;height:56px;border-radius:14px;background:#fff;color:#1a1a2e;font-size:20px;box-shadow:inset 0 -5px 0 #06d6a0}
.eyebrow{margin-top:auto;color:#06d6a0;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:20px}
h1{font-size:62px;line-height:1.08;letter-spacing:-.03em;margin:14px 0 22px;font-weight:800}
p{margin:0;font-size:24px;color:#b9bfd3}
.photo{position:relative;margin:56px 64px 56px 0;border-radius:22px;overflow:hidden;border:3px solid #06d6a0}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
</style></head><body>
<div class="copy">
  <div class="mark"><span>JB</span>Joseph Berin</div>
  <div class="eyebrow">Virtual Assistant · Iloilo, Philippines</div>
  <h1>Admin support &amp;<br>data management</h1>
  <p>Inbox · Calendar · Data entry · Product listings · Research</p>
</div>
<div class="photo"><img src="../joseph-berin.jpeg" alt=""></div>
</body></html>
